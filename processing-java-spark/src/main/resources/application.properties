# HBase via ZooKeeper quorum (déclaré dans compose Phase 2)
hbase.zookeeper.quorum=zookeeper
hbase.zookeeper.property.clientPort=2181

# Table HBase cible
hbase.table=tracks_by_genre
hbase.column.family=cf

# Requête source (ajuste à tes besoins)
# Ici: exemple top N par genre (via chart_snapshots + tracks + genres)
sql.query=\
SELECT \
  COALESCE(cs.ref_genre_id, -1) AS genre_id, \
  g.name AS genre_name, \
  t.track_id, \
  t.title, \
  t.rank, \
  (SELECT a.name FROM artists a WHERE a.artist_id = t.artist_id) AS artist_name \
FROM chart_snapshots cs \
JOIN tracks t ON t.track_id = cs.track_id \
LEFT JOIN genres g ON g.genre_id = cs.ref_genre_id \
WHERE cs.snapshot_time >= NOW() - INTERVAL '1 day'

# Combien d’enregistrements maximum à traiter (pour tests)
limit.rows=5000
