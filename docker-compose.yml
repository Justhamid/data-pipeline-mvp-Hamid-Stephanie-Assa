version: '3.8'

services:
  # Service Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    command:
      - bash
      - -c
      - |
        if [ ! -f /var/lib/kafka/data/meta.properties ]; then
          CLUSTER_ID=$$(kafka-storage random-uuid)
          kafka-storage format --ignore-formatted --cluster-id $$CLUSTER_ID --config /etc/kafka/kafka.properties
        fi
        exec /etc/confluent/docker/run
    volumes:
      - ./docker/kafka-data:/var/lib/kafka/data

  # PostgreSQL
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: datapipeline
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  # App (producer/consumer Python)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    depends_on:
      - kafka
      - postgres
      - namenode
    volumes:
      - "./producer:/app/producer"
      - "./consumer:/app/consumer"
      - "./etl:/app/etl"
    environment:
      - KAFKA_BROKER=kafka:9092
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=datapipeline
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin

  # Hadoop NameNode
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    environment:
      - CLUSTER_NAME=hadoop-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
    volumes:
      - ./hadoop/namenode:/hadoop/dfs/name
    ports:
      - "9870:9870"
      - "9000:9000"

  # Hadoop DataNode
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_datanode_data_dir=file:///hadoop/dfs/data
    volumes:
      - ./hadoop/datanode:/hadoop/dfs/data
    ports:
      - "9864:9864"
    depends_on:
      - namenode

  # MapReduce container
  mapreduce:
    build:
      context: ./processing-java
      dockerfile: Dockerfile
    container_name: mapreduce
    depends_on:
      - namenode
      - datanode
    volumes:
      - ./processing-java:/processing-java
      - ./hdfs_data:/hdfs
    networks:
      - default

# Volumes persistants globaux
volumes:
  kafka_data:
  hdfs_data:
